<!DOCTYPE html>
<html lang="en">
  <!--SETUP: Fill in blank properties in HEAD-->
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />

    <!-- Page title shown in browser tab -->
    <title>WebGL Fluid Background</title>

    <!-- Responsive viewport settings for mobile devices -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <!-- Ensure compatibility with Internet Explorer -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- Enable full-screen appearance for iOS Safari -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Description for search engines and SEO -->
    <meta name="description" content="A WebGL-based fluid simulation adapted from PavelDoGreat's project, optimised for creating dynamic website backgrounds." />
    <meta name="author" content="Thomas Kabalin" />

    <!-- Open Graph metadata for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:url" content="" />

    <!--SETUP: add a browser tab icon-->
    <link rel="icon" href="" type="image/png" />

    <!--SETUP: update the file paths if you move the file-->
    <!-- Cache-busting: bump ASSET_VER when you deploy to force fresh assets -->
    <link rel="stylesheet" href="fluid-overlay-styles.css?v=3" />

    <!--REMOVE THE FOLLOWING LINE-->
    <meta name="google-site-verification" content="KxV1WEjEkGzvRm3viGVmb1_nOUMs4bxHwcnRzFqIgxQ" />
  </head>

  <body>
    <canvas></canvas>
    <!--The canvas on which the animation is drawn-->

    <!--START OF CONTENT-->

    <a href="https://github.com/tkabalin/WebGL-Fluid-Background/blob/master/README.md" target="_blank" class="read_me">
      View the README
    </a>

    <!-- Hidden file inputs -->
    <input type="file" id="maskFileInput" accept="image/*" style="display:none" />
    <input type="file" id="overlayFileInput" accept="image/*" style="display:none" />

    <!-- Mask uploader controls -->
    <div class="mask-controls">
      <button type="button" id="maskUploadBtn">选择图片</button>
      <button type="button" id="maskResetBtn">重置</button>
      <button type="button" id="overlayUploadBtn">替换顶层</button>
      <button type="button" id="gifExportBtn">导出 GIF</button>
      <button type="button" id="controlsToggleBtn" title="流体设置">⚙️</button>
    </div>

    <!-- Fluid controls panel (collapsed by default) -->
    <div id="controlsPanel" class="controls-panel hidden">
      <div class="controls-header">
        <span>流体调节</span>
        <button type="button" id="controlsCloseBtn" title="关闭">×</button>
      </div>
      <div class="controls-body">
        <label class="ctrl-row">
          <span class="ctrl-label">流动模式</span>
          <select id="ctrlFlowMode">
            <option value="random">随机</option>
            <option value="edge">顺时针边缘</option>
            <option value="safe">安全区内随机</option>
          </select>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">旋转速度</span>
          <input type="range" id="ctrlEdgeSpeed" min="0.02" max="0.2" step="0.01" />
          <span class="ctrl-value" id="valEdgeSpeed"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">顶部占比</span>
          <input type="range" id="ctrlSafeTop" min="0" max="0.5" step="0.01" />
          <span class="ctrl-value" id="valSafeTop"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">底部占比</span>
          <input type="range" id="ctrlSafeBottom" min="0" max="0.5" step="0.01" />
          <span class="ctrl-value" id="valSafeBottom"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">流动区域</span>
          <input type="range" id="ctrlMaskScale" min="0.5" max="1.5" step="0.05" />
          <span class="ctrl-value" id="valMaskScale"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">流体大小</span>
          <input type="range" id="ctrlSplatRadius" min="0.01" max="1.0" step="0.01" />
          <span class="ctrl-value" id="valSplatRadius"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">喷射频率</span>
          <input type="range" id="ctrlAutoInterval" min="0.02" max="0.5" step="0.01" />
          <span class="ctrl-value" id="valAutoInterval"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">喷射力度</span>
          <input type="range" id="ctrlAutoForce" min="100" max="3000" step="50" />
          <span class="ctrl-value" id="valAutoForce"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">色块数量</span>
          <input type="range" id="ctrlAutoCount" min="1" max="8" step="1" />
          <span class="ctrl-value" id="valAutoCount"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">消散速度</span>
          <input type="range" id="ctrlDensity" min="0" max="4" step="0.1" />
          <span class="ctrl-value" id="valDensity"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">漩涡强度</span>
          <input type="range" id="ctrlCurl" min="0" max="50" step="1" />
          <span class="ctrl-value" id="valCurl"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">颜色色相</span>
          <input type="range" id="ctrlHue" min="0" max="1" step="0.01" />
          <span class="ctrl-value" id="valHue"></span>
          <span class="ctrl-swatch" id="swatchHue"></span>
        </label>
        <label class="ctrl-row">
          <span class="ctrl-label">背景颜色</span>
          <input type="color" id="ctrlBackColor" />
        </label>
        <button type="button" id="ctrlResetDefaults" class="reset-btn">恢复默认设置</button>
        <button type="button" id="ctrlShowConfig" class="reset-btn">复制当前设置为 JSON</button>
      </div>
    </div>

    <!--END OF CONTENT-->

    <!--SETUP: update the file paths if you move the file. Moving config and the LDR image requires making changes in the script-->
    <script src="./webgl-fluid.js?v=3"></script>
    <script>
      // Wire up the mask uploader buttons (webgl-fluid.js listens on the input).
      const _maskInput = document.getElementById("maskFileInput");
      const _uploadBtn = document.getElementById("maskUploadBtn");
      const _resetBtn = document.getElementById("maskResetBtn");

      if (_uploadBtn && _maskInput) {
        _uploadBtn.addEventListener("click", () => _maskInput.click());
      }
      if (_resetBtn && _maskInput) {
        _resetBtn.addEventListener("click", () => {
          _maskInput.value = "";
          // Dispatch a change with no file so the handler resets the mask.
          _maskInput.dispatchEvent(new Event("change"));
        });
      }

      // Top-layer overlay replacement button.
      const _overlayInput = document.getElementById("overlayFileInput");
      const _overlayBtn = document.getElementById("overlayUploadBtn");
      if (_overlayBtn && _overlayInput) {
        _overlayBtn.addEventListener("click", () => _overlayInput.click());
      }

      // GIF export button — calls the recording function exposed by webgl-fluid.js.
      const _gifBtn = document.getElementById("gifExportBtn");
      if (_gifBtn) {
        _gifBtn.addEventListener("click", () => {
          if (window.startFluidGif) window.startFluidGif();
        });
      }

      // ---- Fluid controls panel ----
      (function () {
        const panel = document.getElementById("controlsPanel");
        const toggleBtn = document.getElementById("controlsToggleBtn");
        const closeBtn = document.getElementById("controlsCloseBtn");

        function openPanel() { panel.classList.remove("hidden"); }
        function closePanel() { panel.classList.add("hidden"); }
        if (toggleBtn) toggleBtn.addEventListener("click", () => {
          panel.classList.contains("hidden") ? openPanel() : closePanel();
        });
        if (closeBtn) closeBtn.addEventListener("click", closePanel);

        // Wait until the simulation has exposed the live config object.
        function whenReady(cb) {
          if (window.fluidConfig) cb(window.fluidConfig);
          else setTimeout(() => whenReady(cb), 50);
        }

        whenReady((config) => {
          // ---- Persistence: restore saved values, auto-save on every change ----
          const STORE_KEY = "fluidSettings_v1";
          const PERSIST_KEYS = [
            "AUTO_SPLATS_MODE", "EDGE_FLOW_SPEED", "SAFE_FLOW_TOP", "SAFE_FLOW_BOTTOM", "MASK_SCALE",
            "SPLAT_RADIUS", "AUTO_SPLATS_INTERVAL", "AUTO_SPLATS_FORCE",
            "AUTO_SPLATS_COUNT", "DENSITY_DISSIPATION", "CURL",
            "SPLAT_HUE", "BACK_COLOR",
          ];
          let saved = null;
          try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
          if (saved) {
            PERSIST_KEYS.forEach((k) => {
              if (saved[k] !== undefined) config[k] = saved[k];
            });
          }
          let saveTimer = null;
          function saveSettings() {
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
              const out = {};
              PERSIST_KEYS.forEach((k) => { out[k] = config[k]; });
              try { localStorage.setItem(STORE_KEY, JSON.stringify(out)); } catch (e) {}
              saveTimer = null;
            }, 150);
          }

          // Generic range binder: input event writes to config + updates label + saves.
          function bindRange(inputId, valueId, key, fmt) {
            const el = document.getElementById(inputId);
            const val = document.getElementById(valueId);
            if (!el) return;
            el.value = config[key];
            if (val) val.textContent = fmt ? fmt(config[key]) : config[key];
            el.addEventListener("input", () => {
              const v = parseFloat(el.value);
              config[key] = v;
              if (val) val.textContent = fmt ? fmt(v) : v;
              saveSettings();
            });
          }

          // Flow mode select (random / clockwise edge).
          const modeEl = document.getElementById("ctrlFlowMode");
          if (modeEl) {
            modeEl.value = config.AUTO_SPLATS_MODE || "random";
            modeEl.addEventListener("change", () => {
              config.AUTO_SPLATS_MODE = modeEl.value;
              saveSettings();
            });
          }
          bindRange("ctrlEdgeSpeed", "valEdgeSpeed", "EDGE_FLOW_SPEED");
          bindRange("ctrlSafeTop", "valSafeTop", "SAFE_FLOW_TOP");
          bindRange("ctrlSafeBottom", "valSafeBottom", "SAFE_FLOW_BOTTOM");

          bindRange("ctrlSplatRadius", "valSplatRadius", "SPLAT_RADIUS");
          bindRange("ctrlAutoInterval", "valAutoInterval", "AUTO_SPLATS_INTERVAL");

          // Flow region scale — resizing the mask needs a recompute + a kick.
          const scaleEl = document.getElementById("ctrlMaskScale");
          const scaleVal = document.getElementById("valMaskScale");
          if (scaleEl) {
            scaleEl.value = config.MASK_SCALE == null ? 1.0 : config.MASK_SCALE;
            if (scaleVal) scaleVal.textContent = parseFloat(scaleEl.value).toFixed(2);
            scaleEl.addEventListener("input", () => {
              const v = parseFloat(scaleEl.value);
              config.MASK_SCALE = v;
              if (scaleVal) scaleVal.textContent = v.toFixed(2);
              if (window.refreshFluidMask) window.refreshFluidMask();
              saveSettings();
            });
          }
          bindRange("ctrlAutoForce", "valAutoForce", "AUTO_SPLATS_FORCE", v => Math.round(v));
          bindRange("ctrlAutoCount", "valAutoCount", "AUTO_SPLATS_COUNT", v => Math.round(v));
          bindRange("ctrlDensity", "valDensity", "DENSITY_DISSIPATION");
          bindRange("ctrlCurl", "valCurl", "CURL", v => Math.round(v));

          // Hue slider with live colour swatch preview.
          const hueEl = document.getElementById("ctrlHue");
          const hueVal = document.getElementById("valHue");
          const hueSwatch = document.getElementById("swatchHue");
          function hsvToHex(h) {
            // s=1, v=1 → hex string
            let i = Math.floor(h * 6), f = h * 6 - i, p = 0, q = 1 - f, t = f;
            let r, g, b;
            switch (i % 6) {
              case 0: r = 1; g = t; b = p; break;
              case 1: r = q; g = 1; b = p; break;
              case 2: r = p; g = 1; b = t; break;
              case 3: r = p; g = q; b = 1; break;
              case 4: r = t; g = p; b = 1; break;
              case 5: r = 1; g = p; b = q; break;
            }
            const toHex = x => Math.round(x * 255).toString(16).padStart(2, "0");
            return "#" + toHex(r) + toHex(g) + toHex(b);
          }
          function updateHue() {
            const v = parseFloat(hueEl.value);
            config.SPLAT_HUE = v;
            if (hueVal) hueVal.textContent = v.toFixed(2);
            if (hueSwatch) hueSwatch.style.background = hsvToHex(v);
            saveSettings();
          }
          if (hueEl) {
            hueEl.value = config.SPLAT_HUE;
            hueEl.addEventListener("input", updateHue);
            updateHue();
          }

          // Background colour picker → config.BACK_COLOR {r,g,b} 0..255.
          const backEl = document.getElementById("ctrlBackColor");
          if (backEl) {
            const toHex = x => x.toString(16).padStart(2, "0");
            backEl.value = "#" + toHex(config.BACK_COLOR.r) + toHex(config.BACK_COLOR.g) + toHex(config.BACK_COLOR.b);
            backEl.addEventListener("input", () => {
              const hex = backEl.value; // #rrggbb
              config.BACK_COLOR = {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16),
              };
              saveSettings();
            });
          }

          // "Restore defaults" — clears saved settings and reloads the page so
          // config.json values are used again.
          const resetDefaultsBtn = document.getElementById("ctrlResetDefaults");
          if (resetDefaultsBtn) {
            resetDefaultsBtn.addEventListener("click", () => {
              try { localStorage.removeItem(STORE_KEY); } catch (e) {}
              location.reload();
            });
          }

          // "Copy current settings as JSON" — copies the live config values
          // so they can be pasted into config.json as the new defaults.
          const showCfgBtn = document.getElementById("ctrlShowConfig");
          if (showCfgBtn) {
            showCfgBtn.addEventListener("click", async () => {
              const out = {};
              PERSIST_KEYS.forEach((k) => { out[k] = config[k]; });
              const text = JSON.stringify(out, null, 2);
              try {
                await navigator.clipboard.writeText(text);
                showCfgBtn.textContent = "已复制!粘到聊天框";
              } catch (e) {
                // Fallback: open a prompt so the user can copy manually.
                window.prompt("复制下面的 JSON:", text);
              }
              setTimeout(() => { showCfgBtn.textContent = "复制当前设置为 JSON"; }, 2500);
            });
          }
        });
      })();
    </script>
  </body>
</html>
